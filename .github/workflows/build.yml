name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # npm run package (not npx pbiviz package) so postpackage renames the
      # artifact to the friendly dist/html-studio-x.y.z.pbiviz
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
          retention-days: 30
